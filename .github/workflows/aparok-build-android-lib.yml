name: Aparok Android Library Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.0.1). Defaults to run number + short SHA.'
        required: false
        default: ''
  push:
    branches:
      - aparok/offline-private

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  build-android-lib:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'



      - name: Export NDK path
        run: |
          NDK28=$(ls -d ${ANDROID_HOME}/ndk/30.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK28" ]; then
            echo "ERROR: NDK 30.x not found in $ANDROID_HOME/ndk"
            ls ${ANDROID_HOME}/ndk/
            exit 1
          fi
          echo "Using NDK: $NDK28"
          echo "ANDROID_NDK=$NDK28" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK28" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK28" >> $GITHUB_ENV

      - name: Set build version
        run: |
          VERSION=${{ github.event.inputs.version }}
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.run_number }}-${{ github.sha }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          mkdir -p $GITHUB_WORKSPACE/deps
          go build -o $GITHUB_WORKSPACE/deps/gomobile golang.org/x/mobile/cmd/gomobile
          go build -o $GITHUB_WORKSPACE/deps/gobind golang.org/x/mobile/cmd/gobind
          echo "$GITHUB_WORKSPACE/deps" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/deps:$PATH"
          gomobile init

      - name: Build Android AAR
        run: |
          mkdir -p .release
          make compile-android-lib || true
          echo "--- temp go.mod ---"
          ls -lha /tmp/gomobile-work-*/src-android-arm64/go.mod || true
          cat /tmp/gomobile-work-*/src-android-arm64/go.mod || true
          echo "--- repo go.mod head ---"
          head -n 10 go.mod
          ls -lha lib.aar || true
          ls -lha .release/ || true

      - name: Create checksums
        run: |
          sha256sum lib.aar > lib.aar.sha256
          sha256sum .release/android_lib_${{ env.VERSION }}.tar.gz > .release/android_lib_${{ env.VERSION }}.tar.gz.sha256 || true
          cat lib.aar.sha256

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: aparok-android-lib-${{ env.VERSION }}
          path: |
            lib.aar
            lib.aar.sha256
            .release/android_lib_${{ env.VERSION }}.tar.gz
            .release/android_lib_${{ env.VERSION }}.tar.gz.sha256

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aparok-core-${{ env.VERSION }}
          name: Aparok Core ${{ env.VERSION }}
          files: |
            lib.aar
            lib.aar.sha256
            .release/android_lib_${{ env.VERSION }}.tar.gz
            .release/android_lib_${{ env.VERSION }}.tar.gz.sha256
